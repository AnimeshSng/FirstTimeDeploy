<template>
    <lightning-card>
        <h3 slot="title">
            <lightning-icon icon-name="utility:connected_apps" size="small"></lightning-icon>
            Your detailed info here please !
        </h3>
   <div class="slds-p-around_medium lgc-bg">
    <lightning-input type="text" name="taskTitle" label="Task title" value={taskTitle} required onchange={handleOnChange}></lightning-input>
    <template lwc:if={showDueDate}>
    <lightning-input 
        type="date" 
        name="dueDate" 
        label="Due date" 
        value ={dueDate}
        required
        onchange={handleOnChange}>
    </lightning-input>
</template></div>
        <div slot="footer">
            <template lwc:if={showSave}>
                <lightning-button
                    variant="success"
                    label="Save"
                    onclick={handleClick}>
                </lightning-button>
                
                <lightning-button
                class="slds-m-left_medium"
                    variant="success"
                    label="cancel" >
                </lightning-button>
                
            </template>
        </div>
    </lightning-card>
</template>
