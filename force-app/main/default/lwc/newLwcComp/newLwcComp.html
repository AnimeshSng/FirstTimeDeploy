<template>
    <lightning-card>
 <div class="slds-m-around_medium">
<lightning-input type="file" label="Attachment"></lightning-input>
</div>
</lightning-card>
    <lightning-combobox
        name="account"
        label="Account"
        placeholder="Select an Account"
        value={value}
        options={accountOptions}
        onchange={handleChange}>
    </lightning-combobox>
    <lightning-button variant="brand" label="Save" title="Save action" action="success" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
    <template if:true={label}>
        <p>Selected Account Name: {label}</p>
</template>
